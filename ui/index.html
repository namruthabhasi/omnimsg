<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OmniMessage Inbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --ink:#0d1030; --text:#f3f5ff; --muted:rgba(243,245,255,.62);
  --glass:rgba(255,255,255,.08); --glass-strong:rgba(255,255,255,.14);
  --edge:rgba(255,255,255,.2); --teal:#2ee6c5; --coral:#ff7a8a; --violet:#8a7bff;
  --tg:#3aa8e8; --wa:#25d366; --ig:#e1306c; --ms:#0a84ff;
  --radius:22px;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  color:var(--text); background:var(--ink); overflow:hidden;
}
.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;background:radial-gradient(circle at 20% 10%,#1a1f5c,#0d1030 60%)}
.aurora i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.75}
.aurora i:nth-child(1){width:46vw;height:46vw;left:-8vw;top:-10vw;background:var(--violet)}
.aurora i:nth-child(2){width:38vw;height:38vw;right:-6vw;top:12vh;background:var(--teal);opacity:.5}
.aurora i:nth-child(3){width:42vw;height:42vw;left:30vw;bottom:-18vw;background:var(--coral);opacity:.55}
.glass{
  background:var(--glass);
  backdrop-filter:blur(26px) saturate(150%);-webkit-backdrop-filter:blur(26px) saturate(150%);
  border:1px solid var(--edge);border-radius:var(--radius);
  box-shadow:0 18px 50px rgba(5,8,40,.35),inset 0 1px 0 rgba(255,255,255,.25);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--edge);background:var(--glass-strong);border-radius:14px;padding:9px 14px;transition:background .15s}
button:hover{background:rgba(255,255,255,.24)}
button.primary{background:linear-gradient(135deg,var(--teal),#4fb9ff);color:#06122e;font-weight:700;border-color:transparent}
button.primary:hover{filter:brightness(1.08)}
input,select,textarea{background:rgba(255,255,255,.08);border:1px solid var(--edge);border-radius:14px;padding:10px 14px;outline:none;width:100%}
select option{color:#111}
input::placeholder,textarea::placeholder{color:var(--muted)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

/* login */
#login{position:fixed;inset:0;z-index:5;display:grid;place-items:center;padding:20px}
#login form{width:min(400px,100%);padding:34px;display:grid;gap:14px}
#login h1{font-size:1.7rem;font-weight:700}
#login p{color:var(--muted);font-size:.95rem;line-height:1.5}
label{font-size:.85rem;color:var(--muted);display:grid;gap:6px}
.err{color:#ffb3bd;font-size:.9rem;min-height:1.2em}
#advancedToggle{justify-self:start;padding:5px 10px;font-size:.82rem}
.demo-info{padding:12px;border:1px solid var(--edge);border-radius:14px;background:var(--glass);font-size:.85rem;line-height:1.5}
.demo-info code{overflow-wrap:anywhere}

/* app */
#app{position:fixed;inset:0;z-index:1;display:none;grid-template-columns:350px 1fr;grid-template-rows:auto 1fr;gap:16px;padding:16px}
#app.on{display:grid}
.top{grid-column:1/-1;padding:14px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top h2{font-size:1.15rem;font-weight:700}
.live{display:flex;align-items:center;gap:7px;font-size:.85rem;color:var(--muted)}
.dot{width:9px;height:9px;border-radius:50%;background:#7b7f9e}
.dot.ok{background:var(--teal);box-shadow:0 0 10px var(--teal)}
.stats{display:flex;gap:10px;flex:1;overflow-x:auto;padding:2px}
.tile{padding:8px 14px;border-radius:16px;background:var(--glass);border:1px solid var(--edge);min-width:104px}
.tile b{display:block;font-size:1.2rem}
.tile span{font-size:.78rem;color:var(--muted)}
.tile small{display:block;font-size:.75rem;color:var(--muted);margin-top:2px}

.list{display:flex;flex-direction:column;min-height:0}
.filters{padding:14px;display:grid;gap:10px;border-bottom:1px solid var(--edge)}
.filters .row{display:flex;gap:8px}
#items{overflow-y:auto;padding:10px;display:grid;gap:8px;align-content:start}
.conv{padding:12px 14px;border-radius:18px;border:1px solid transparent;background:transparent;text-align:left;width:100%;display:grid;gap:4px}
.conv:hover,.conv.on{background:var(--glass-strong);border-color:var(--edge)}
.conv .line{display:flex;justify-content:space-between;gap:10px;align-items:center}
.conv .name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .prev{font-size:.86rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv time{font-size:.75rem;color:var(--muted);flex:none}
.badge{font-size:.72rem;padding:2px 9px;border-radius:99px;border:1px solid var(--edge)}
.ch-telegram{background:rgba(58,168,232,.25)}.ch-whatsapp{background:rgba(37,211,102,.25)}
.ch-instagram{background:rgba(225,48,108,.28)}.ch-messenger{background:rgba(10,132,255,.28)}
.st-needs_human{background:rgba(255,122,138,.3);border-color:var(--coral)}
.unread{background:var(--teal);color:#06122e;font-weight:700;border-radius:99px;font-size:.75rem;padding:1px 8px}
.tags{display:flex;gap:6px;flex-wrap:wrap;align-items:center}

.chat{display:flex;flex-direction:column;min-height:0}
.chead{padding:14px 18px;border-bottom:1px solid var(--edge);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.chead .who{flex:1;min-width:160px}
.chead h3{font-size:1.05rem}
.back{display:none}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ctrl select{width:auto;padding:7px 12px}
#msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:10px}
.m{max-width:min(70%,520px);padding:10px 14px;border-radius:18px;border:1px solid var(--edge);background:var(--glass-strong);line-height:1.45;overflow-wrap:anywhere}
.m small{display:block;font-size:.72rem;color:var(--muted);margin-top:4px}
.m.customer{align-self:flex-start;border-bottom-left-radius:6px}
.m.ai{align-self:flex-end;border-bottom-right-radius:6px;background:rgba(46,230,197,.18)}
.m.human{align-self:flex-end;border-bottom-right-radius:6px;background:rgba(255,122,138,.2)}
.reply{padding:14px;border-top:1px solid var(--edge);display:flex;gap:10px}
.reply textarea{resize:none;height:46px}
.empty{margin:auto;text-align:center;color:var(--muted);padding:30px;line-height:1.6}
.note{font-size:.8rem;color:var(--muted);padding:0 18px 10px}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:9;padding:10px 18px;border-radius:14px;display:none;max-width:90vw}

@media(max-width:820px){
  body{overflow:auto}
  #app{grid-template-columns:1fr;grid-template-rows:auto 1fr}
  .chat{display:none}
  #app.chat-open .list{display:none}
  #app.chat-open .chat{display:flex}
  #app.chat-open .stats{display:none}
  .back{display:inline-block}
  .m{max-width:86%}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>

<section id="login">
  <form class="glass" id="loginForm">
    <h1>OmniMessage</h1>
    <p>Sign in to see customer chats from Telegram, WhatsApp, Instagram and Messenger in one inbox.</p>
    <button id="advancedToggle" type="button" aria-expanded="false" aria-controls="serverAddress">Advanced</button>
    <div id="serverAddress" hidden><label>Server address<input id="base" required></label></div>
    <div class="demo-info" id="demoCredentials" hidden aria-live="polite">
      Demo account: <strong id="demoEmail"></strong><br>
      Password: <code id="demoPassword"></code>
    </div>
    <p id="demoInfoStatus" class="err" role="status" hidden></p>
    <label>Email<input id="email" type="email" value="me@example.com" required autocomplete="username"></label>
    <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
    <div class="err" id="loginErr" role="alert"></div>
    <button class="primary" type="submit">Sign in</button>
  </form>
</section>

<main id="app">
  <header class="top glass">
    <h2>Inbox</h2>
    <div class="live"><span class="dot" id="dot"></span><span id="liveTxt">Connecting</span></div>
    <div class="stats" id="stats"></div>
    <button id="logout">Sign out</button>
  </header>

  <aside class="list glass">
    <div class="filters">
      <input id="search" placeholder="Search names or messages" aria-label="Search">
      <div class="row">
        <select id="fChannel" aria-label="Channel">
          <option value="">All channels</option><option>telegram</option><option>whatsapp</option>
          <option>instagram</option><option>messenger</option>
        </select>
        <select id="fStatus" aria-label="Status">
          <option value="">Any status</option><option value="open">Open</option>
          <option value="needs_human">Needs human</option><option value="closed">Closed</option>
        </select>
      </div>
    </div>
    <div id="items"></div>
  </aside>

  <section class="chat glass" id="chat">
    <div class="empty">Pick a conversation on the left to read it and reply.</div>
  </section>
</main>
<div id="toast" class="glass" role="status"></div>

<script>
const API_BASE = "https://YOUR-BACKEND-URL";
const $ = s => document.querySelector(s);
const S = { base:'', token:null, active:null, ws:null, convs:[] };
const SK = 'omni_session';
const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
const defaultBase = isLocalhost ? (window.location.protocol === 'file:' ? 'http://localhost:8000' : window.location.origin) : API_BASE;
S.base = defaultBase;
$('#base').value = defaultBase;

function toast(msg){ const t=$('#toast'); t.textContent=msg; t.style.display='block'; clearTimeout(toast.t); toast.t=setTimeout(()=>t.style.display='none',4000); }
function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!==undefined) e.textContent=text; return e; }
function when(ts){ if(!ts) return ''; const d=new Date(/[zZ]|[+-]\d\d:?\d\d$/.test(ts)?ts:ts+'Z'); const now=new Date();
  return d.toDateString()===now.toDateString()? d.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : d.toLocaleDateString([], {day:'numeric',month:'short'}); }
function pretty(k){ k=k.replace(/_/g,' '); return k.charAt(0).toUpperCase()+k.slice(1); }

async function api(path, opts={}){
  const r = await fetch(S.base+path, { ...opts, headers:{ 'Content-Type':'application/json', ...(S.token?{Authorization:'Bearer '+S.token}:{}), ...(opts.headers||{}) } });
  if(r.status===401 && S.token){ signOut('Session expired. Please sign in again.'); throw new Error('401'); }
  let data=null; try{ data=await r.json(); }catch(e){}
  if(!r.ok){ const d=data&&data.detail; throw new Error(typeof d==='string'?d:(d?JSON.stringify(d):('Request failed ('+r.status+')'))); }
  return data;
}

async function loadDemoInfo(base=S.base){
  const box=$('#demoCredentials'), status=$('#demoInfoStatus');
  box.hidden=true; status.hidden=true;
  try{
    const r=await fetch(base.replace(/\/$/,'')+'/api/v1/demo-info');
    if(!r.ok) throw new Error('Request failed ('+r.status+')');
    const info=await r.json();
    if(info.demo===true && typeof info.email==='string' && typeof info.password==='string'){
      $('#demoEmail').textContent=info.email;
      $('#demoPassword').textContent=info.password;
      box.hidden=false;
    }
  }catch(error){
    console.error('Could not load demo information:',error);
    status.textContent='Demo login information could not be loaded.';
    status.hidden=false;
  }
}

$('#advancedToggle').addEventListener('click',()=>{
  const panel=$('#serverAddress'), toggle=$('#advancedToggle');
  panel.hidden=!panel.hidden;
  toggle.setAttribute('aria-expanded',String(!panel.hidden));
});
$('#base').addEventListener('change',()=>loadDemoInfo($('#base').value.trim()));
loadDemoInfo();

/* auth */
$('#loginForm').addEventListener('submit', async e=>{
  e.preventDefault(); $('#loginErr').textContent='';
  S.base=$('#base').value.trim().replace(/\/$/,'');
  try{
    await loadDemoInfo(S.base);
    const d = await api('/api/v1/auth/login',{method:'POST',body:JSON.stringify({email:$('#email').value,password:$('#password').value})});
    S.token=d.access_token;
    try{ sessionStorage.setItem(SK, JSON.stringify({base:S.base,token:S.token})); }catch(_){}
    start();
  }catch(err){ $('#loginErr').textContent = err.message==='Failed to fetch' ? 'Cannot reach the server. Check the address and that it is running.' : err.message; }
});
function signOut(msg){
  S.token=null; try{ sessionStorage.removeItem(SK); }catch(_){}
  if(S.ws){ S.ws.close(); S.ws=null; }
  $('#app').classList.remove('on'); $('#login').style.display='grid';
  $('#loginErr').textContent = msg||'';
}
$('#logout').onclick=()=>signOut();

/* start */
function start(){
  $('#login').style.display='none'; $('#app').classList.add('on');
  loadStats(); loadList(); connectWS();
}

/* stats: shows whatever numbers the dashboard endpoint returns */
async function loadStats(){
  try{
    const s = await api('/api/v1/dashboard/stats'); const box=$('#stats'); box.replaceChildren();
    let n=0;
    for(const [k,v] of Object.entries(s)){
      if(n>=7) break;
      const t=el('div','tile');
      if(typeof v==='number' || (typeof v==='string' && v!=='')){
        t.append(el('b',null,typeof v==='number'?String(Math.round(v*100)/100):v), el('span',null,pretty(k)));
      } else if(v && typeof v==='object' && !Array.isArray(v)){
        const parts=Object.entries(v).slice(0,4).map(([a,b])=>a+' '+(b&&typeof b==='object'?Object.values(b).join('/'):(typeof b==='number'?Math.round(b*100)/100:b)));
        if(!parts.length) continue;
        t.append(el('span',null,pretty(k))); t.append(el('small',null,parts.join(',  ')));
      } else continue;
      box.append(t); n++;
    }
  }catch(e){ if(e.message!=='401') $('#stats').textContent='Stats unavailable'; }
}

/* list */
let lt; $('#search').addEventListener('input',()=>{clearTimeout(lt); lt=setTimeout(loadList,300);});
$('#fChannel').onchange=loadList; $('#fStatus').onchange=loadList;
async function loadList(){
  const p=new URLSearchParams({limit:50});
  if($('#fChannel').value) p.set('channel',$('#fChannel').value);
  if($('#fStatus').value) p.set('status',$('#fStatus').value);
  if($('#search').value.trim()) p.set('search',$('#search').value.trim());
  try{
    const d=await api('/api/v1/conversations?'+p); S.convs=d.items||[];
    const box=$('#items'); box.replaceChildren();
    if(!S.convs.length){ box.append(el('div','empty','No conversations match. Clear the filters or send a test message.')); return; }
    for(const c of S.convs){
      const b=el('button','conv'+(c.id===S.active?' on':'')); b.type='button';
      const l1=el('div','line'); l1.append(el('span','name',c.customer_name||c.external_user_id), el('time',null,when(c.last_message_at)));
      const lm=c.last_message; const l2=el('div','prev',lm?((lm.sender_type==='customer'?'':(lm.sender_type==='ai'?'AI: ':'You: '))+lm.text):'No messages yet');
      const l3=el('div','tags'); l3.append(el('span','badge ch-'+c.channel,c.channel));
      if(c.status==='needs_human') l3.append(el('span','badge st-needs_human','Needs human'));
      else if(c.status==='closed') l3.append(el('span','badge','Closed'));
      if(c.unread_count>0) l3.append(el('span','unread',String(c.unread_count)));
      b.append(l1,l2,l3); b.onclick=()=>openConv(c.id); box.append(b);
    }
  }catch(e){ if(e.message!=='401') toast('Could not load conversations: '+e.message); }
}

/* conversation */
function msgsOf(d){ let m=d.messages ?? d.items ?? []; if(!Array.isArray(m)) m=m.items||[]; return m.slice().sort((a,b)=>new Date(a.timestamp)-new Date(b.timestamp)); }
async function openConv(id){
  S.active=id; $('#app').classList.add('chat-open');
  document.querySelectorAll('.conv').forEach(x=>x.classList.remove('on'));
  try{
    const d=await api('/api/v1/conversations/'+id);
    const base=S.convs.find(c=>c.id===id)||{}; const c={...base, ...(d.conversation||d)};
    renderChat(c, msgsOf(d));
    if((base.unread_count||c.unread_count)>0){ api('/api/v1/conversations/'+id+'/read',{method:'POST'}).then(loadList).catch(()=>{}); }
    else loadList();
  }catch(e){ if(e.message!=='401') toast('Could not open conversation: '+e.message); }
}
function renderChat(c, msgs){
  const box=$('#chat'); box.replaceChildren();
  const head=el('div','chead'); const back=el('button','back','Back'); back.type='button'; back.onclick=()=>{$('#app').classList.remove('chat-open');};
  const who=el('div','who'); who.append(el('h3',null,c.customer_name||c.external_user_id||'Customer'));
  const tg=el('div','tags'); tg.append(el('span','badge ch-'+c.channel,c.channel||'')); who.append(tg);
  const ctrl=el('div','ctrl');
  const ai=el('button',null,c.ai_enabled?'AI replies on':'AI replies off'); ai.type='button';
  ai.title='Turn automatic AI replies on or off for this chat';
  ai.onclick=()=>patch(c.id,{ai_enabled:!c.ai_enabled});
  const st=el('select'); st.setAttribute('aria-label','Status');
  for(const [v,t] of [['open','Open'],['needs_human','Needs human'],['closed','Closed']]){ const o=el('option',null,t); o.value=v; if(c.status===v) o.selected=true; st.append(o); }
  st.onchange=()=>patch(c.id,{status:st.value});
  ctrl.append(ai,st); head.append(back,who,ctrl);
  const list=el('div'); list.id='msgs';
  if(!msgs.length) list.append(el('div','empty','No messages in this conversation yet.'));
  for(const m of msgs){
    const b=el('div','m '+(m.sender_type||'customer')); b.append(document.createTextNode(m.text||''));
    const who2=m.sender_type==='ai'?'AI':(m.sender_type==='human'?'Agent':'Customer');
    b.append(el('small',null,who2+' at '+when(m.timestamp))); list.append(b);
  }
  const note=el('div','note','Sending a reply as an agent turns off AI replies for this chat.');
  const form=el('form','reply'); const ta=el('textarea'); ta.placeholder='Write a reply'; ta.setAttribute('aria-label','Reply'); ta.rows=1;
  const send=el('button','primary','Send'); send.type='submit';
  ta.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); form.requestSubmit(); }});
  form.onsubmit=async e=>{ e.preventDefault(); const text=ta.value.trim(); if(!text) return; send.disabled=true;
    try{ await api('/api/v1/conversations/'+c.id+'/reply',{method:'POST',body:JSON.stringify({text,keep_ai_enabled:false})}); ta.value=''; await openConv(c.id); }
    catch(err){ if(err.message!=='401') toast('Reply failed: '+err.message); } finally{ send.disabled=false; } };
  form.append(ta,send); box.append(head,list,note,form);
  list.scrollTop=list.scrollHeight;
}
async function patch(id,body){
  try{ await api('/api/v1/conversations/'+id,{method:'PATCH',body:JSON.stringify(body)}); await openConv(id); loadStats(); }
  catch(e){ if(e.message!=='401') toast('Update failed: '+e.message); }
}

/* live updates */
function connectWS(){
  if(S.ws) S.ws.close();
  const url=S.base.replace(/^http/,'ws')+'/api/v1/ws'; let ws;
  try{ ws=new WebSocket(url); }catch(e){ return; } S.ws=ws;
  ws.onopen=()=>ws.send(JSON.stringify({type:'auth',token:S.token}));
  ws.onmessage=ev=>{
    let m; try{ m=JSON.parse(ev.data); }catch(_){ return; }
    if(m.type==='auth.ok'){ $('#dot').classList.add('ok'); $('#liveTxt').textContent='Live'; return; }
    if(/^(message|conversation)\./.test(m.type||'')){ loadList(); loadStats(); if(S.active && m.type==='message.new') openConv(S.active); }
  };
  ws.onclose=()=>{ $('#dot').classList.remove('ok'); $('#liveTxt').textContent='Offline'; if(S.token && S.ws===ws) setTimeout(connectWS,4000); };
}

/* resume a session after refresh */
try{ const s=JSON.parse(sessionStorage.getItem(SK)||'null'); if(s&&s.token){ S.base=s.base; S.token=s.token; $('#base').value=s.base; loadDemoInfo(S.base); start(); } }catch(_){}
</script>
</body>
</html>
